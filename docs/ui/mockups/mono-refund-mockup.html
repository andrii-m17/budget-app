<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONO-REFUND макет</title>
<!-- Погоджено Андрієм 17.11.2026. Токени й розміри — з наявного рядка вхідних (.expense-row, .mono-inst-label, .chip, .mono-badge, .success-toast). Нові елементи: мітка повернення (тло --color-info-bg, текст --color-info) і закреслена стара сума (12 px, --color-text-secondary). Суми й назви — вигадані. -->
<style>
body{margin:0;padding:16px;background:#0B0F16;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.mr-wrap{display:flex;gap:16px;flex-wrap:wrap}
.mr-ph{flex:1 1 300px;max-width:390px;border-radius:26px;padding:16px 20px 20px;box-sizing:border-box}
.mr-d{--bg:#0B0F16;--sf:#151B26;--sfh:#1E2530;--bd:#262E3B;--t1:#F1F4F8;--t2:#94A0B4;--ab:rgba(34,197,94,.16);--at:#34D673;--ib:rgba(59,130,246,.18);--it:#60A5FA;--gl:rgba(21,27,38,.92)}
.mr-l{--bg:#F7F8FA;--sf:#FFFFFF;--sfh:#F1F3F5;--bd:#E6EAF2;--t1:#101828;--t2:#64748B;--ab:rgba(34,197,94,.16);--at:#166534;--ib:#EAF1FE;--it:#3B82F6;--gl:rgba(255,255,255,.95)}
.mr-ph{background:var(--bg);color:var(--t1)}
.mr-cap{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
.mr-cap:first-child{margin-top:0}
.mr-row{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;min-height:68px;box-sizing:border-box;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mr-name{font-size:16px}
.mr-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
.mr-b{height:22px;padding:0 7px;border-radius:11px;background:var(--sfh);font-size:12.5px;font-weight:700;line-height:22px}
.mr-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--ab);color:var(--at);white-space:nowrap}
.mr-m{font-size:12px;color:var(--t2)}
.mr-lab{display:inline-flex;margin-top:6px;padding:4px 10px;border-radius:20px;background:var(--ib);color:var(--it);font-size:12px;font-weight:600}
.mr-amt{font-family:ui-monospace,Menlo,monospace;font-size:16px;white-space:nowrap;text-align:right}
.mr-old{display:block;font-size:12px;color:var(--t2);text-decoration:line-through;margin-top:3px}
.mr-dim{opacity:.75}
.mr-toast{display:inline-flex;gap:10px;align-items:center;padding:10px 12px;border-radius:22px;background:var(--gl);border:1px solid var(--bd);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.mr-ti{width:36px;height:36px;border-radius:50%;background:var(--ib);color:var(--it);display:grid;place-items:center;font-size:17px}
.mr-tt{font-size:14px;font-weight:600;line-height:18.2px}
.mr-ts{font-size:12.5px;color:var(--t2);line-height:16.25px}
</style></head><body>
<div class="mr-wrap"><div class="mr-ph mr-d" id="a"></div><div class="mr-ph mr-l" id="b"></div></div>
<script>
const h=`
<div class="mr-cap">1 · Нові: часткове повернення враховано автоматично</div>
<div class="mr-row"><div><div class="mr-name">Самокат</div>
<div class="mr-meta"><span class="mr-b">mono</span><span class="mr-chip">Транспорт · Самокат</span><span class="mr-m">09:13 · ••0000</span></div>
<span class="mr-lab">↩ Повернено 27 ₴ із 50 ₴</span></div>
<div class="mr-amt">−23 ₴<span class="mr-old">−50 ₴</span></div></div>
<div class="mr-cap">2 · Нові: звичайне повернення, потрібне підтвердження</div>
<div class="mr-row"><div><div class="mr-name">Магазин одягу</div>
<div class="mr-meta"><span class="mr-b">mono</span><span class="mr-m">14:02 · ••0000</span></div>
<span class="mr-lab">↩ Повернення до витрати 12 лис, 1 200 ₴ ›</span></div>
<div class="mr-amt">+400 ₴</div></div>
<div class="mr-cap">3 · Пропущені: слід повернення</div>
<div class="mr-row mr-dim"><div><div class="mr-name">Скасування. Самокат</div>
<div class="mr-meta"><span class="mr-b">mono</span><span class="mr-m">09:16 · ••0000</span><span class="mr-m">Повернення враховано автоматично</span></div></div>
<div class="mr-amt">+27 ₴</div></div>
<div class="mr-cap">4 · Сповіщення, коли витрату вже додано</div>
<div class="mr-toast"><div class="mr-ti">↩</div><div><div class="mr-tt">Повернення 27 ₴ враховано</div><div class="mr-ts">Самокат: 50 ₴ → 23 ₴</div></div></div>`;
a.innerHTML=h;b.innerHTML=h;
</script></body></html>
